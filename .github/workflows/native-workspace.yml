name: Native workspace witness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'test/native-workspace/**'
      - '.github/workflows/native-workspace.yml'

permissions:
  contents: read

concurrency:
  group: native-workspace-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  selection-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize sanitized setup evidence
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-workspace-report'
          report.mkdir(mode=0o700)
          (report / 'setup.json').write_text(json.dumps({'event': 'setup started', 'note': 'This is not fixture execution or acceptance evidence; inspect runner report and job conclusion.'}) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Locked tokenless setup without lifecycle scripts
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            npm --prefix test/native-workspace ci --ignore-scripts --workspaces=false \
              --registry=https://registry.npmjs.org \
              --userconfig=/nonexistent-native-witness-npmrc --globalconfig=/dev/null \
              --cache="$RUNNER_TEMP/native-witness-npm-cache" --no-audit --no-fund
      - name: Permit unprivileged user namespaces
        # Ubuntu 24.04 AppArmor restricts unprivileged user namespaces by
        # default, which makes unshare fail before the supervisor starts.
        # Hosted-runner sudo is passwordless; the witness itself still runs
        # unprivileged with dropped capabilities. Best effort: failure here is
        # still diagnosed via runner.json unshareErrorCode. The original
        # value is captured and restored after the witness step.
        run: |
          original="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 1)"
          echo "orig_userns_restrict=$original" >> "$GITHUB_ENV"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - name: Bound-socket refusal probe (host namespace)
        # Regression probe: plants a live listening socket under a temp
        # exposed tree and requires the runner's bound-socket check in the
        # host namespaces to refuse it (clean tree and /usr must pass).
        run: |
          set -euo pipefail
          env -i PATH="$PATH" GITHUB_ACTIONS=true \
            node test/native-workspace/runner.mjs --bound-socket-probe
      - name: Actual native service in rootless network isolation
        run: |
          set -euo pipefail
          env -i PATH="$PATH" GITHUB_ACTIONS=true \
            node test/native-workspace/runner.mjs "$RUNNER_TEMP/native-workspace-report"
      - name: Restore user namespace restriction
        if: always()
        run: |
          if [ -n "${orig_userns_restrict:-}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$orig_userns_restrict" || true
          fi
      - name: Sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-workspace-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/native-workspace-report/setup.json
            ${{ runner.temp }}/native-workspace-report/runner.json
            ${{ runner.temp }}/native-workspace-report/supervise.json
            ${{ runner.temp }}/native-workspace-report/child.json
            ${{ runner.temp }}/native-workspace-report/assertions.json
            ${{ runner.temp }}/native-workspace-report/test.xml
          if-no-files-found: error
          retention-days: 7
