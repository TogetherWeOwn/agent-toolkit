name: Cloudflare provider contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-contracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cloudflare-postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify runner PostgreSQL client
        run: psql --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Test candidate SQL against isolated PostgreSQL (not native qualification)
        env:
          CLOUDFLARE_POSTGRES_TEST: '1'
          CLOUDFLARE_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: node --test --test-timeout=120000 plugins/cloudflare-broker/testing/postgres-contracts.mjs

  cloudflare-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Test bounded Pages traversal and evidence manifest
        run: node --test --test-timeout=30000 test/cloudflare-pages-traversal.test.mjs
      - run: node --test --test-timeout=30000 test/cloudflare-*.test.mjs
      - name: Regenerate complete pinned API operation inventory
        if: always()
        run: |
          set -euo pipefail
          schema_dir=$(mktemp -d "$RUNNER_TEMP/cloudflare-schema.XXXXXX")
          inventory_dir="$RUNNER_TEMP/cloudflare-inventory"
          mkdir -p "$inventory_dir"
          curl -fsS --max-time 120 --max-filesize 60000000 \
            https://raw.githubusercontent.com/cloudflare/api-schemas/650bd71c22db3b938a4611bf4cc5afd896b400b7/openapi.json \
            -o "$schema_dir/openapi.json"
          node plugins/cloudflare-broker/scripts/inventory.mjs "$schema_dir/openapi.json" "$inventory_dir/operations.jsonl"
          node plugins/cloudflare-broker/scripts/families.mjs "$inventory_dir/operations.jsonl" "$inventory_dir/families.json"
          node --input-type=module - "$inventory_dir" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = process.argv[2];
          const bytes = readFileSync(`${dir}/operations.jsonl`);
          const rows = bytes.toString('utf8').trimEnd().split('\n').map(line => JSON.parse(line));
          const source = JSON.parse(readFileSync('plugins/cloudflare-broker/coverage/source.json', 'utf8'));
          source.inventorySha256 = createHash('sha256').update(bytes).digest('hex');
          source.counts.descriptors = rows.filter(row => row.typedTool !== null).length;
          source.counts.metadataDescriptors = rows.filter(row => row.implementation === 'descriptor-only').length;
          writeFileSync(`${dir}/source.json`, JSON.stringify(source, null, 2) + '\n');
          JS
      - name: Save generated source coverage for authoring
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-source-inventory
          path: ${{ runner.temp }}/cloudflare-inventory/
          if-no-files-found: error
          retention-days: 7
      - name: Verify committed inventory matches generated source
        if: always()
        run: |
          cmp plugins/cloudflare-broker/coverage/operations.jsonl "$RUNNER_TEMP/cloudflare-inventory/operations.jsonl"
          cmp plugins/cloudflare-broker/coverage/families.json "$RUNNER_TEMP/cloudflare-inventory/families.json"
          node --input-type=module - "$RUNNER_TEMP/cloudflare-inventory/source.json" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.deepEqual(JSON.parse(readFileSync(process.argv[2], 'utf8')),
            JSON.parse(readFileSync('plugins/cloudflare-broker/coverage/source.json', 'utf8')));
          JS
      - name: Reproduce pinned supplemental R2 S3 compatibility inventory
        run: |
          set -euo pipefail
          docs_dir=$(mktemp -d "$RUNNER_TEMP/cloudflare-docs.XXXXXX")
          curl -fsS --max-time 120 --max-filesize 1000000 \
            https://raw.githubusercontent.com/cloudflare/cloudflare-docs/53ce9b502646fdc019b8184b29b9f1054939e1b6/src/content/docs/r2/api/s3/api.mdx \
            -o "$docs_dir/r2-s3.mdx"
          node plugins/cloudflare-broker/scripts/supplemental.mjs "$docs_dir/r2-s3.mdx" "$docs_dir/r2-s3.json"
          cmp plugins/cloudflare-broker/coverage/r2-s3.json "$docs_dir/r2-s3.json"
