name: Supply-chain policy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned project-local probe tools without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/policy-tools" --ignore-scripts --no-audit --no-fund npm@11.19.0 pnpm@10.34.9
          printf '%s\n' "$RUNNER_TEMP/policy-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Require native JavaScript policy capability
        run: |
          npm --version
          pnpm --version
          npm config ls -l | grep -q 'min-release-age ='
      - name: Check config and available native managers
        run: python3 -I -m unittest discover -s test -p 'test_supply_chain_policy.py' -v
