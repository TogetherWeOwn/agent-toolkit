name: gitleaks

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          report_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          trap 'rm -rf -- "$report_dir"' EXIT
          scan_status=0
          docker run --rm -v "$PWD:/repo:ro" -v "$report_dir:/report" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --exit-code 1 \
            --report-format json --report-path /report/findings.json || scan_status=$?
          # Do not upload or print the report: only explicitly selected metadata is safe.
          node scripts/gitleaks-metadata.mjs "$report_dir/findings.json"
          exit "$scan_status"
